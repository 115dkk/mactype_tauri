<!doctype html>
<html>
<head><meta charset="utf-8"><title>Cover</title>
<style>
html, body { height: auto; min-height: 0; margin: 0; }
body { overflow: visible; padding: 0; background: var(--color-canvas); }
.ds-cover { position: relative; width: 960px; height: 288px; background: var(--color-canvas); color: var(--color-foreground); overflow: hidden; }
.ds-cover svg { position: absolute; inset: 0; }
.ds-cover .ds-accent { fill: var(--color-primary); }
.ds-cover .ds-tint { fill: var(--color-surface-subtle); }
.ds-cover .ds-signal { fill: var(--color-success); }
.ds-cover .ds-ink { fill: var(--color-foreground); }
.ds-cover .ds-dot { fill: var(--color-canvas); }
.ds-cover .ds-block { rx: var(--radius-control); ry: var(--radius-control); }
.ds-cover-text { position: absolute; left: 48px; right: 48px; bottom: 26px; }
.ds-cover-name { margin: 0; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; font-size: 64px; font-weight: 600; line-height: 0.95; letter-spacing: -0.5px; color: var(--color-foreground); }
.ds-cover-tagline { margin: 8px 0 0; font-size: 14px; line-height: 20px; color: var(--color-muted); }
</style>
</head>
<body>

       pattern: dot grid (a 4px-grid, dense technical surface for glyph rendering), 60 dots cut out in color-canvas at a space-4 pitch inside the ink block
