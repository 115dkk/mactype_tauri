<!-- @dsCard group="Inputs" height=176 subtitle="Text, search, select, number, range, checkbox and radio" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Field</title>
<style>
html, body { height: auto; min-height: 0; }
body { overflow: visible; padding: 16px; }
.ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ds-stack { display: grid; gap: 12px; justify-items: start; }
</style>
</head>
<body>
<div class="ds-stack" style="max-width: 460px">
  <div class="ds-row">
    <input aria-label="New profile name" type="text" value="Reading.ini" style="padding-inline: 8px">
    <label class="search-field">{{icon:Search:16}}<span class="sr-only">Search settings</span><input placeholder="Search settings" type="search"></label>
  </div>
  <div class="ds-row">
    <select aria-label="Hinting mode"><option>Default</option><option>No hinting</option><option>Auto hinting</option></select>
    <label><input checked type="checkbox"> Changed only</label>
    <label><input checked name="ds-radio" type="radio"> sRGB</label>
    <label><input name="ds-radio" type="radio"> Compatibility</label>
  </div>
  <div class="range-control" style="width: 100%">
    <input aria-label="Gamma value" max="2.5" min="0.5" step="0.05" type="range" value="1.4">
    <input aria-label="Gamma value" step="0.05" type="number" value="1.40">
    <div class="setting-actions">
      <button aria-label="Revert Gamma value to the saved value" class="icon-button" type="button">{{icon:Undo2:14}}</button>
      <button aria-label="Restore the default for Gamma value" class="icon-button" type="button">{{icon:RotateCcw:14}}</button>
    </div>
  </div>
</div>
</body>
</html>
