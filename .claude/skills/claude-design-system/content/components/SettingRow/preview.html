<!-- @dsCard group="Settings" height=236 subtitle="All settings rows: select, range with exact value, switch, dirty mark and hint" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SettingRow</title>
<style>
html, body { height: auto; min-height: 0; }
body { overflow: visible; padding: 16px; }

</style>
</head>
<body>
<div class="settings-form" style="padding: 0">
  <div class="setting-row">
    <div class="setting-label"><span class="hint"><span class="hint-term"><label for="ds-hinting">Hinting mode</label></span></span></div>
    <div class="range-control discrete-control"><select id="ds-hinting"><option>Default</option><option>No hinting</option><option>Auto hinting</option></select></div>
  </div>
  <div class="setting-row">
    <div class="setting-label"><span class="hint"><span class="hint-term"><label for="ds-gamma">Gamma value</label></span></span><span class="dirty-mark">Changed</span></div>
    <div class="range-control">
      <input id="ds-gamma" max="2.5" min="0.5" step="0.05" type="range" value="1.4">
      <input aria-label="Gamma value" step="0.05" type="number" value="1.40">
      <div class="setting-actions">
        <button aria-label="Revert Gamma value to the saved value" class="icon-button" type="button">{{icon:Undo2:14}}</button>
        <button aria-label="Restore the default for Gamma value" class="icon-button" disabled type="button">{{icon:RotateCcw:14}}</button>
      </div>
    </div>
  </div>
  <div class="setting-row">
    <div class="setting-label"><label for="ds-autostart">Start in the tray at sign-in</label><p>Open Control Center in the tray when you sign in to Windows.</p></div>
    <label class="switch-control"><input checked id="ds-autostart" role="switch" type="checkbox"><span aria-hidden="true">On</span></label>
  </div>
</div>
</body>
</html>
