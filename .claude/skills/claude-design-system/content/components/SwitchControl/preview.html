<!-- @dsCard group="Inputs" height=96 subtitle="On, off, disabled; state word beside the track" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>SwitchControl</title>
<style>
html, body { height: auto; min-height: 0; }
body { overflow: visible; padding: 16px; }
.ds-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.ds-stack { display: grid; gap: 12px; justify-items: start; }
</style>
</head>
<body>
<div class="ds-row" style="gap: 24px">
  <label class="switch-control"><input aria-label="Start in the tray at sign-in" checked role="switch" type="checkbox"><span aria-hidden="true">On</span></label>
  <label class="switch-control"><input aria-label="Hinting" role="switch" type="checkbox"><span aria-hidden="true">Off</span></label>
  <label class="switch-control"><input aria-label="Disabled on" checked disabled role="switch" type="checkbox"><span aria-hidden="true">On</span></label>
  <label class="switch-control"><input aria-label="Disabled off" disabled role="switch" type="checkbox"><span aria-hidden="true">Off</span></label>
</div>
</body>
</html>
