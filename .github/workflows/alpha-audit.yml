# Alpha Architecture & Tech Debt Audit
#
# Runs /improve-codebase-architecture and /tech-debt-audit against
# codex/alpha-plus-dll in a single Claude Code session, and files the two
# deliverables as a GitHub issue. Skips a scheduled run when no code changed
# on that branch since the last audit tag.
#
# This file is the only part of the audit that lives on main. GitHub schedules
# workflows from the default branch and nowhere else, so an alpha-only file
# would never fire. Everything the audit touches in this repository is on
# codex/alpha-plus-dll: the tree it checks out and the change-detection list
# in .github/audit-pathspecs.txt. Nothing here analyses main. The audit skills
# are not vendored anywhere: they come from the 115dkk-skills plugin
# (requirement 4).
#
# Like every other fork CI workflow, this file must never be cherry-picked
# onto codex/upstream-pr-prep.
#
# Requirements:
#   1. A Claude Console federation rule for GitHub Actions (Settings >
#      Workload identity > Connect workload). The session pays from Claude
#      API credit through Workload Identity Federation: this run's GitHub
#      OIDC token is exchanged for a short-lived Anthropic token, so no key
#      is stored. Match the rule to this file and nothing wider:
#        subject   repo:115dkk/mactype_tauri:ref:refs/heads/main
#        claims    repository_owner_id = 33408534
#                  workflow_ref = 115dkk/mactype_tauri/.github/workflows/alpha-audit.yml@refs/heads/main
#        audience  left empty (https://api.anthropic.com)
#        CEL       claims.event_name in ["schedule", "workflow_dispatch"]
#      Leave the token lifetime at its default: the GitHub token lives about
#      five minutes and Anthropic caps its own token at twice that, which
#      is why the audit step keeps rewriting the token file.
#   2. Repository Actions variables (identifiers, not secrets):
#      ANTHROPIC_FEDERATION_RULE_ID (fdrl_...), ANTHROPIC_ORGANIZATION_ID
#      (the organization UUID) and ANTHROPIC_SERVICE_ACCOUNT_ID (svac_...).
#      ANTHROPIC_WORKSPACE_ID only when the rule covers more than one
#      workspace. ALPHA_AUDIT_MODEL only to replace the default
#      claude-mythos-5-1, for example when the organization has no access
#      to it.
#   3. Actions workflow permissions set to "Read and write permissions".
#   4. Nothing vendored for the skills. Each run installs the 115dkk-skills
#      plugin from the default branch of its marketplace, 115dkk/agent-skills
#      (public, so no token), and the prompt calls
#      /115dkk-skills:improve-codebase-architecture and
#      /115dkk-skills:tech-debt-audit. It is deliberately unpinned (the
#      plugin manifest pins no version either) so the audit runs what the
#      maintainer uses; the issue body records the commit it ran. Both skills
#      are self-contained and model-invocable, so nothing has to be unlocked
#      before the session can run them. .github/audit-skills on
#      codex/alpha-plus-dll is no longer read.
#   5. A push path to codex/alpha-plus-dll for the commit-baseline job.
#      TECH_DEBT_AUDIT.md is committed to that branch after every audit and
#      is the next audit's baseline: tech-debt-audit reads the file in the
#      repository root as the previous run, keeps its TD-NN IDs and lists
#      what was resolved since. The job checks out with the RELEASE_DEPLOY_KEY
#      secret when the repository has one (a deploy key gets past a ruleset
#      that requires checks) and with the workflow token otherwise. Neither
#      credential is given to the audit job, where the Claude session has a
#      shell.
#
# The job provisions the whole buildable surface, renderer included, because
# on this branch the renderer is a modified fork rather than an inherited
# import: the DirectWrite work, the hook coverage, the stack budget and the
# FreeType ownership rules all live in it. Auditing it by reading alone would
# leave the largest body of fork-authored C++ unverified.
#
# .github/scripts/Build-OpenCore.ps1 on codex/alpha-plus-dll does that in one
# call. It clones the four pinned dependencies, asserts the FreeType fork's
# private glyph ABI and subpixel option are present, builds MacType x86 and
# x64 in Rel+Detours, and builds and ctests both service injectors. The same
# script runs in that branch's Build and package workflow under a 60 minute
# timeout, so it fits inside this job's budget with room to spare.

name: Alpha Audit

on:
  schedule:
    # Monthly on the 22nd. Deliberately away from the 1st and the 15th, which
    # is when the audits in the other repositories run, and off the hour.
    - cron: '37 9 22 * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Run even if no relevant code changed'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  AUDIT_REF: codex/alpha-plus-dll

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_audit: ${{ steps.detect.outputs.should_audit }}
      last_audit_ref: ${{ steps.detect.outputs.last_audit_ref }}
      changed_files_count: ${{ steps.detect.outputs.changed_files_count }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/alpha-plus-dll
          fetch-depth: 0
          fetch-tags: true

      - name: Detect code changes since last audit
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t code_pathspecs < .github/audit-pathspecs.txt

          if [ "${{ inputs.force_run }}" = "true" ]; then
            echo "Force run requested."
            echo "should_audit=true" >> "$GITHUB_OUTPUT"
            echo "last_audit_ref=HEAD~50" >> "$GITHUB_OUTPUT"
            echo "changed_files_count=forced" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mapfile -t audit_tags < <(git tag -l 'audit/alpha-*' --sort=-creatordate)
          LAST_AUDIT="${audit_tags[0]:-}"

          if [ -z "$LAST_AUDIT" ]; then
            echo "Initial audit."
            echo "should_audit=true" >> "$GITHUB_OUTPUT"
            echo "last_audit_ref=" >> "$GITHUB_OUTPUT"
            echo "changed_files_count=initial" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Last audit: $LAST_AUDIT"
          echo "last_audit_ref=$LAST_AUDIT" >> "$GITHUB_OUTPUT"

          CODE_CHANGES=$(git diff --name-only "$LAST_AUDIT"..HEAD -- "${code_pathspecs[@]}" | wc -l | tr -d ' ')

          echo "Code files changed: $CODE_CHANGES"
          echo "changed_files_count=$CODE_CHANGES" >> "$GITHUB_OUTPUT"

          if [ "$CODE_CHANGES" -eq 0 ]; then
            echo "No relevant code changes. Skipping audit."
            echo "should_audit=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_audit=true" >> "$GITHUB_OUTPUT"
          fi

  audit:
    needs: check-changes
    if: needs.check-changes.outputs.should_audit == 'true'
    # Same image the rest of this repository's Windows jobs use, so the
    # toolchain the session finds is the toolchain CI builds with.
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        # Git Bash, which is also what Claude Code's own shell tool reaches
        # for on Windows. Every run step below stays POSIX-shaped.
        shell: bash
    # Only this job asks GitHub for an OIDC token. A job-level block replaces
    # the workflow-level one, so the two grants it already needed are repeated.
    permissions:
      contents: write
      issues: write
      id-token: write
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      AUDIT_MODEL: ${{ vars.ALPHA_AUDIT_MODEL || 'claude-mythos-5-1' }}
    steps:
      # Ahead of the hour of provisioning below, so a missing variable, a rule
      # that does not match this run or a model the organization cannot use
      # fails in seconds instead of after the build. Its exchange also passes
      # the Console's connection test.
      - name: Verify workload identity federation
        run: |
          set -euo pipefail

          for name in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Repository variable $name is not set. See Requirements at the top of alpha-audit.yml."
              exit 1
            fi
          done

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::GitHub offered no OIDC token. The audit job needs the id-token: write permission."
            exit 1
          fi

          # Only ever applied to a JWT and an opaque access token, neither of
          # which can hold a quote or an escape.
          json_string() {
            tr -d '\r\n' | sed -n "s/.*\"$1\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/p"
          }

          identity_token=$(curl -fsS --retry 3 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | json_string value)
          if [ -z "$identity_token" ]; then
            echo "::error::GitHub's OIDC response carried no token."
            exit 1
          fi
          echo "::add-mask::$identity_token"

          workspace_field=""
          if [ -n "${ANTHROPIC_WORKSPACE_ID:-}" ]; then
            workspace_field=$(printf ', "workspace_id": "%s"' "$ANTHROPIC_WORKSPACE_ID")
          fi
          response=$(mktemp)
          status=$(curl -sS -o "$response" -w '%{http_code}' https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            -d "$(printf '{"grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer", "assertion": "%s", "federation_rule_id": "%s", "organization_id": "%s", "service_account_id": "%s"%s}' \
              "$identity_token" "$ANTHROPIC_FEDERATION_RULE_ID" "$ANTHROPIC_ORGANIZATION_ID" \
              "$ANTHROPIC_SERVICE_ACCOUNT_ID" "$workspace_field")")
          access_token=$(json_string access_token < "$response")
          if [ "$status" != 200 ] || [ -z "$access_token" ]; then
            echo "::error::The federation exchange was refused (HTTP $status). The Console records the reason under Workload identity > Authentication events."
            cat "$response"
            exit 1
          fi
          echo "::add-mask::$access_token"

          # A one-line request on the audit model, so an organization that
          # cannot use it finds out now. Costs a fraction of a cent.
          status=$(curl -sS -o "$response" -w '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "authorization: Bearer $access_token" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d "$(printf '{"model": "%s", "max_tokens": 128, "output_config": {"effort": "low"}, "messages": [{"role": "user", "content": "Reply with OK."}]}' "$AUDIT_MODEL")")
          if [ "$status" != 200 ]; then
            echo "::error::$AUDIT_MODEL refused a one-line request (HTTP $status). If the organization cannot use it, set the ALPHA_AUDIT_MODEL repository variable, for example to claude-fable-5-1."
            cat "$response"
            exit 1
          fi
          rm -f "$response"
          echo "Federation exchange succeeded and $AUDIT_MODEL answered."

      - uses: actions/checkout@v7
        with:
          ref: codex/alpha-plus-dll
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: control-center/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy

      - uses: microsoft/setup-msbuild@v3

      # Gives the session a built renderer to reason against instead of a
      # source tree it can only read. Also leaves the pinned dependencies and
      # the Rel+Detours object trees in place, so a targeted rebuild of one
      # project costs seconds rather than another full provision.
      - name: Build the open core, renderer included
        shell: pwsh
        run: .github/scripts/Build-OpenCore.ps1

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install frontend dependencies
        working-directory: control-center
        run: pnpm install --frozen-lockfile

      - name: Install audit skills
        id: skills
        run: |
          set -euo pipefail

          # Both audit skills come from the 115dkk-skills plugin, fetched
          # fresh on every run (requirement 4 in the header).
          claude plugin marketplace add 115dkk/agent-skills
          claude plugin install 115dkk-skills@115dkk
          PLUGIN_PATH=$(claude plugin list --json | jq -er '.[] | select(.id == "115dkk-skills@115dkk" and .enabled) | .installPath')
          # The CLI reports a Windows path; Git Bash wants its own form.
          PLUGIN_PATH=$(cygpath -u "$PLUGIN_PATH")

          # The prompt tells the model to run both skills, and it can only do
          # that through the Skill tool. A disable-model-invocation line
          # arriving with a plugin update would leave that part improvising
          # without its skill, so stop here instead.
          for skill in improve-codebase-architecture tech-debt-audit; do
            SKILL_MD="$PLUGIN_PATH/skills/$skill/SKILL.md"
            test -f "$SKILL_MD"
            if grep -q "^disable-model-invocation:" "$SKILL_MD"; then
              echo "::error::115dkk-skills:$skill carries disable-model-invocation, so the audit cannot invoke it."
              exit 1
            fi
          done

          PLUGIN_SHA=$(jq -r '.plugins["115dkk-skills@115dkk"][0].gitCommitSha // "unknown"' \
            "$HOME/.claude/plugins/installed_plugins.json" 2>/dev/null || echo unknown)
          echo "plugin_ref=115dkk/agent-skills@${PLUGIN_SHA:0:12}" >> "$GITHUB_OUTPUT"

          echo "Installed audit skills from 115dkk/agent-skills@${PLUGIN_SHA}:"
          find "$PLUGIN_PATH/skills" -maxdepth 2 -name SKILL.md -print

      - name: Generate change summary
        id: changes
        run: |
          set -euo pipefail

          mapfile -t code_pathspecs < .github/audit-pathspecs.txt

          LAST_REF="${{ needs.check-changes.outputs.last_audit_ref }}"
          if [ -n "$LAST_REF" ]; then
            echo "## Changed files" > change-summary.txt
            echo "" >> change-summary.txt
            git diff --stat "$LAST_REF"..HEAD -- "${code_pathspecs[@]}" >> change-summary.txt 2>/dev/null || true
          else
            echo "Initial audit run." > change-summary.txt
          fi

      - name: Run combined audit
        run: |
          # TECH_DEBT_AUDIT.md in the checkout is the previous audit, which
          # the commit-baseline job committed (requirement 5). The skill reads
          # it as its baseline and overwrites it, so remember its blob: a
          # session that never writes a new report must not pass on the old
          # file.
          BASELINE_BLOB=$(git hash-object TECH_DEBT_AUDIT.md 2>/dev/null || echo none)

          # Any of these outranks federation in the CLI and would bill
          # something other than the federated service account.
          unset ANTHROPIC_API_KEY ANTHROPIC_AUTH_TOKEN CLAUDE_CODE_OAUTH_TOKEN

          # The CLI exchanges the GitHub OIDC token in this file itself and
          # re-reads the file whenever it refreshes its Anthropic token, at
          # most ten minutes later. A GitHub token lives about five minutes
          # and is accepted once, so a background loop writes a fresh one
          # every three minutes for as long as the session runs. The loop's
          # output goes to a file rather than this step's log pipe, which a
          # leftover sleep would otherwise hold open.
          token_dir="$(cygpath -u "$RUNNER_TEMP")/anthropic-wif"
          mkdir -p "$token_dir"
          ANTHROPIC_IDENTITY_TOKEN_FILE="$(cygpath -m "$token_dir")/identity-token"
          export ANTHROPIC_IDENTITY_TOKEN_FILE

          write_identity_token() {
            curl -fsS --retry 3 \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
              | tr -d '\r\n' \
              | sed -n 's/.*"value"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
              > "$token_dir/identity-token.next" || return 1
            [ -s "$token_dir/identity-token.next" ] || return 1
            mv -f "$token_dir/identity-token.next" "$token_dir/identity-token"
          }

          write_identity_token
          (
            while sleep 180; do
              write_identity_token ||
                echo "::warning::Could not refresh the GitHub OIDC token; the next attempt is in three minutes."
            done
          ) > "$token_dir/refresh.log" 2>&1 &
          refresh_pid=$!
          stop_identity_refresh() {
            kill "$refresh_pid" 2>/dev/null || true
            cat "$token_dir/refresh.log" 2>/dev/null || true
          }
          trap stop_identity_refresh EXIT

          # The audit runs on Mythos 5.1 unless ALPHA_AUDIT_MODEL names
          # another model. The availableModels restriction dates from the
          # Fable 5.1 pin, whose safety classifiers could silently re-run a
          # flagged request on Opus 4.8 and keep the session there; it stays,
          # naming the audit model, so the session can never drift to another
          # model: anything that would switch models ends with an explicit
          # error instead, and no tokens are spent elsewhere. Availability
          # fallback is opt-in through --fallback-model and stays unset.
          set +e
          claude \
            --model "$AUDIT_MODEL" \
            --effort xhigh \
            --settings "{\"availableModels\": [\"$AUDIT_MODEL\"]}" \
            --permission-mode auto \
            --max-turns 100 \
            -p "
          You will perform two analyses in sequence within this single
          session. Each part writes its deliverable to its own Markdown
          file in the repository root (do not commit them). Print only a
          short completion summary to stdout: in this non-interactive
          session only the final message reaches stdout, so anything not
          written to a file is lost.

          ENVIRONMENT:
          - This checkout is the codex/alpha-plus-dll branch of the
            115dkk/mactype_tauri fork, not main. main is a narrower tree
            that feeds an upstream pull request; alpha is where the work
            happens. Audit what is in front of you and do not reason about
            what main does or does not carry.
          - You are on a Windows runner with Git Bash as your shell.
            MSBuild, the stable Rust toolchain with clippy and rustfmt,
            Node 24 and pnpm are on PATH, and the Control Center's
            dependencies are already installed.
          - The open core is already built. A previous step ran
            .github/scripts/Build-OpenCore.ps1, so the four pinned
            dependencies are cloned and built under
            build/core-dependencies, their import libraries are in
            deps/lib, MacType x86 and x64 are built in Rel+Detours and
            x64/Rel+Detours, and both service injectors are built and
            their ctest suites have passed.
          - You MAY build and test anything here to check a finding. The
            renderer rebuilds through gdipp.sln with
            /p:Configuration=Rel+Detours and /p:PlatformToolset=v143, and
            because the object trees are warm a targeted project rebuild
            is quick. The Rust workspace under service-runtime takes cargo
            clippy and cargo test, the Control Center is under
            control-center, and service-injector, preview-helper and
            tools/service-probe are CMake.
          - The renderer-specific gates on this branch are available and
            are the fastest way to check a claim about it:
            scripts/ci/Test-RendererStackFrames.ps1 for the foreign-thread
            stack budget, Test-RendererAsan.ps1, Test-OpenCoreCppcheck.ps1,
            Test-RendererActivationContract.ps1 and
            Test-RendererProfileContract.ps1. Run the ones a finding needs
            rather than all of them.
          - Say plainly when a finding is unverified. Do not imply you ran
            something you did not.

          GLOBAL RULES:
          - The renderer on this branch is a modified fork, not an
            inherited import, and it is in scope like the rest of the
            code. Audit its architecture, its lifetimes, its hook and
            FreeType ownership, and its tests.
            docs/source-comment-policy.md calls the inherited sources
            third-party for one narrow purpose only: their original
            Japanese and Chinese commentary is the only documentation that
            code has, so it stays and is never a finding. That exemption
            covers comment prose and nothing else. The contracts those
            files answer to are written down in
            docs/renderer-activation-architecture.md,
            docs/freetype-runtime.md, docs/hooking-compatibility.md and
            docs/renderer-stack-budget.md; read them before calling
            something in that tree a defect.
          - Treat docs/, doc/, evidence/, assets/, and generated files as
            out of scope unless they expose a code or build-system problem.
            The generated settings files (control-center/src/generated,
            generated_settings.rs, generated_settings.h) come from a
            generator; report the generator, not its output.
          - View ids (files, profiles, execution) are interface and are
            never renamed. Domain terms are frozen in CONTEXT.md. Do not
            propose renaming either.
          - Cite file paths for every finding.
          - Do not suggest full rewrites.
          - Do not pad categories with filler findings.

          PART 1: Architecture Analysis
          Run /115dkk-skills:improve-codebase-architecture.
          This is an existing codebase, so use its review report, not the
          foundation or stack report. The skill carries its own glossary
          (module, interface, depth, seam, adapter, leverage, locality)
          and the deletion test in its LANGUAGE.md. Phrase every candidate
          in those exact terms rather than drifting into component,
          service, API, or boundary.
          Identify specific consolidation and deepening opportunities.
          Instead of the skill's HTML report, write the full deliverable as
          Markdown to ARCHITECTURE_AUDIT.md in the repository root: every
          candidate with files, problem, solution, benefits, and
          recommendation strength, plus the closing top recommendation. Do
          not write to the OS temp directory and do not open a browser.
          Stop there. The skill's step 3 is a grilling loop that asks the
          user which candidate to pursue, and this session has no user, so
          do not ask and do not let that step's side effects happen: leave
          CONTEXT.md and docs/adr/ untouched.
          When the file is complete, proceed immediately to Part 2.

          PART 2: Tech Debt Audit
          Run /115dkk-skills:tech-debt-audit.
          TECH_DEBT_AUDIT.md in the repository root, when present, is the
          previous audit, committed by this workflow: read it as the
          skill's baseline. Write the new deliverable over it as the skill
          specifies, with severity, effort estimates, and its 'looks bad
          but is fine' section.
          " > combined-audit-report.md 2>&1
          CLAUDE_EXIT=$?
          set -e

          if [ ! -s combined-audit-report.md ]; then
            echo "Audit produced no output." > combined-audit-report.md
            cat combined-audit-report.md
            exit 1
          fi

          if [ "$CLAUDE_EXIT" -ne 0 ]; then
            echo "Claude audit failed with exit code $CLAUDE_EXIT."
            cat combined-audit-report.md
            exit "$CLAUDE_EXIT"
          fi

          # -p prints only the session's final message, so any part not
          # written to its own file never reaches the issue. Both
          # deliverables are therefore files, and a missing one is a hard
          # failure rather than a quiet gap.
          for deliverable in ARCHITECTURE_AUDIT.md TECH_DEBT_AUDIT.md; do
            if [ ! -s "$deliverable" ]; then
              echo "::error::The audit session did not produce ${deliverable}."
              cat combined-audit-report.md
              exit 1
            fi
          done

          if [ "$(git hash-object TECH_DEBT_AUDIT.md)" = "$BASELINE_BLOB" ]; then
            echo "::error::The audit session left the baseline TECH_DEBT_AUDIT.md unchanged."
            cat combined-audit-report.md
            exit 1
          fi

      - name: Create GitHub Issue or summary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y-%m-%d)
          COUNT="${{ needs.check-changes.outputs.changed_files_count }}"
          HEAD_SHA=$(git rev-parse HEAD)

          {
            echo "# Alpha Audit: ${DATE}"
            echo ""
            echo "Branch: \`codex/alpha-plus-dll\` at \`${HEAD_SHA}\`"
            echo "Changed relevant files: **${COUNT}**"
            echo "Model: \`${AUDIT_MODEL}\` - Effort: xhigh"
            echo "Audit skills: 115dkk-skills (${{ steps.skills.outputs.plugin_ref }})"
            echo ""
            echo "The open core was built before the session started, renderer included, so findings about it could be checked against a build rather than a reading."
            echo ""
            echo "Files readable from this issue:"
            echo "- \`issue-body.md\` - this issue body"
            echo "- \`change-summary.txt\` - comments"
            echo "- \`ARCHITECTURE_AUDIT.md\` - comments (Part 1)"
            echo "- \`TECH_DEBT_AUDIT.md\` - comments (Part 2)"
            echo "- \`combined-audit-report.md\` - comments (session log)"
          } > issue-body.md

          post_file_comments() {
            local issue_number="$1"
            local file_path="$2"
            local title="$3"

            if [ ! -s "$file_path" ]; then
              echo "Skipping empty or missing file: $file_path"
              return 0
            fi

            local comment_dir
            comment_dir=$(mktemp -d)
            awk -v prefix="$comment_dir/part-" -v limit=18000 '
              BEGIN {
                part = 0
                size = 0
                file = sprintf("%s%04d", prefix, part)
              }
              {
                line = $0 ORS
                line_size = length(line)
                if (size > 0 && size + line_size > limit) {
                  close(file)
                  part++
                  file = sprintf("%s%04d", prefix, part)
                  size = 0
                }
                printf "%s", line >> file
                size += line_size
              }
            ' "$file_path"

            local total
            total=$(find "$comment_dir" -type f -name 'part-*' | wc -l | tr -d ' ')
            local index=1

            for part in "$comment_dir"/part-*; do
              {
                echo "## ${title} (${index}/${total})"
                echo ""
                echo "Source file: \`${file_path}\`"
                echo ""
                echo '````markdown'
                cat "$part"
                echo ""
                echo '````'
              } > "$comment_dir/comment.md"

              gh issue comment "$issue_number" \
                --repo "${GITHUB_REPOSITORY}" \
                --body-file "$comment_dir/comment.md"

              index=$((index + 1))
            done
          }

          gh label create audit \
            --repo "${GITHUB_REPOSITORY}" \
            --color "5319e7" \
            --description "Architecture and tech debt audit" \
            >/dev/null 2>&1 || true

          gh label create alpha \
            --repo "${GITHUB_REPOSITORY}" \
            --color "0e8a16" \
            --description "codex/alpha-plus-dll only" \
            >/dev/null 2>&1 || true

          set +e
          ISSUE_ERROR=$(mktemp)
          ISSUE_URL=$(gh issue create \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Alpha Audit: ${DATE}" \
            --body-file issue-body.md \
            --label audit \
            --label alpha 2>"${ISSUE_ERROR}")
          ISSUE_EXIT=$?
          set -e

          if [ "${ISSUE_EXIT}" -eq 0 ]; then
            echo "Created issue: ${ISSUE_URL}"
            ISSUE_NUMBER="${ISSUE_URL##*/}"

            post_file_comments "$ISSUE_NUMBER" change-summary.txt "Change summary"
            post_file_comments "$ISSUE_NUMBER" ARCHITECTURE_AUDIT.md "Architecture audit"
            post_file_comments "$ISSUE_NUMBER" TECH_DEBT_AUDIT.md "Tech debt audit"
            post_file_comments "$ISSUE_NUMBER" combined-audit-report.md "Audit session log"
          else
            echo "::warning::Could not create a GitHub issue. Writing the audit body to the job summary instead."
            cat "${ISSUE_ERROR}"
            {
              echo "## Alpha Audit report"
              echo ""
              echo "GitHub issue creation failed:"
              echo '```'
              cat "${ISSUE_ERROR}"
              echo '```'
              echo ""
              cat issue-body.md
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload report artifact
        uses: actions/upload-artifact@v7
        with:
          name: "alpha-audit-report-${{ github.run_id }}"
          path: |
            combined-audit-report.md
            change-summary.txt
            ARCHITECTURE_AUDIT.md
            TECH_DEBT_AUDIT.md
            issue-body.md
          retention-days: 90

      - name: Tag audit checkpoint
        run: |
          AUDIT_TAG="audit/alpha-$(date +%Y%m%d-%H%M%S)"
          git tag "$AUDIT_TAG"
          git push origin "$AUDIT_TAG"
          echo "Tagged: $AUDIT_TAG"

  commit-baseline:
    # Commits this run's TECH_DEBT_AUDIT.md to codex/alpha-plus-dll as the
    # next audit's baseline (requirement 5 in the header). It runs only after
    # the audit job finished, deliverables checked, issue filed and
    # checkpoint tagged.
    needs: audit
    runs-on: ubuntu-latest
    # Write access for the token fallback; with RELEASE_DEPLOY_KEY set the
    # push goes over SSH with that key instead.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.AUDIT_REF }}
          # Full history, so the rebase onto a branch that moved meanwhile has
          # its merge base.
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          persist-credentials: true

      - uses: actions/download-artifact@v8
        with:
          name: "alpha-audit-report-${{ github.run_id }}"
          path: ${{ runner.temp }}/audit-report

      - name: Commit TECH_DEBT_AUDIT.md as the next baseline
        run: |
          set -euo pipefail

          cp "$RUNNER_TEMP/audit-report/TECH_DEBT_AUDIT.md" TECH_DEBT_AUDIT.md
          if git ls-files --error-unmatch TECH_DEBT_AUDIT.md >/dev/null 2>&1 \
            && git diff --quiet -- TECH_DEBT_AUDIT.md; then
            echo "TECH_DEBT_AUDIT.md is unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TECH_DEBT_AUDIT.md
          # [skip ci] keeps this push from starting the branch's workflows on
          # a commit that only touches this report. The audit's change
          # detection ignores *.md, so it does not trigger the next audit
          # either.
          git commit -m "docs(audit): refresh the tech debt audit baseline [skip ci]" \
            -m "TECH_DEBT_AUDIT.md from Alpha Audit run ${{ github.run_id }}, committed as the next audit's baseline."

          for attempt in 1 2 3; do
            git fetch origin "$AUDIT_REF"
            if git rebase FETCH_HEAD && git push origin "HEAD:$AUDIT_REF"; then
              echo "Committed the baseline as $(git rev-parse HEAD)."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "::warning::Baseline push attempt ${attempt} failed; retrying."
            sleep 5
          done
          echo "::error::Could not push TECH_DEBT_AUDIT.md to $AUDIT_REF after 3 attempts."
          exit 1
