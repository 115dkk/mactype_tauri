name: ChatGPT Repository Bundle Bridge

on:
  push:
    branches:
      - chatgpt/artifact-bridge

permissions:
  contents: read

jobs:
  bundle:
    if: startsWith(github.event.head_commit.message, 'chatgpt-bundle: ')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve requested commit
        id: target
        shell: bash
        run: |
          set -euo pipefail

          first_line="$(git log -1 --format=%B "$GITHUB_SHA" | head -n 1)"
          if [[ ! "$first_line" =~ ^chatgpt-bundle:\ ([0-9a-fA-F]{40})$ ]]; then
            echo "Bridge commits must use: chatgpt-bundle: <40-hex-commit-sha>" >&2
            exit 1
          fi

          target="${BASH_REMATCH[1],,}"
          if ! git cat-file -e "${target}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 \
              "https://github.com/${GITHUB_REPOSITORY}.git" "$target"
          fi
          git cat-file -e "${target}^{commit}"
          echo "sha=$target" >> "$GITHUB_OUTPUT"

      - name: Create self-contained Git bundle
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail

          git branch -f chatgpt-export "$TARGET_SHA"
          git bundle create repository.bundle --all
          git bundle list-heads repository.bundle | grep -F "refs/heads/chatgpt-export"

          printf 'target=%s\ntrigger=%s\nexport_ref=%s\n' \
            "$TARGET_SHA" "$GITHUB_SHA" 'refs/heads/chatgpt-export' \
            > bridge-manifest.txt

      - name: Upload repository bundle
        uses: actions/upload-artifact@v7
        with:
          name: chatgpt-repository-bundle-${{ steps.target.outputs.sha }}
          path: |
            repository.bundle
            bridge-manifest.txt
          if-no-files-found: error
          retention-days: 1
