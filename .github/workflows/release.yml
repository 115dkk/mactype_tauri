name: Release installer

on:
  push:
    tags: ["control-center-v*"]

permissions:
  contents: write

jobs:
  build-release:
    uses: ./.github/workflows/build.yml

  publish:
    needs: build-release
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: mactype-control-center-installer-windows
          path: release/installer
      - uses: actions/download-artifact@v8
        with:
          name: mactype-control-center-integration-developer-bundle-windows
          path: release/integration
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/installer/MacType-Control-Center-Installer.exe
            release/installer/SHA256SUMS.txt
            release/integration/MacType-Control-Center-Integration-Developer-Bundle.zip
            release/integration/INTEGRATION_SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: true
